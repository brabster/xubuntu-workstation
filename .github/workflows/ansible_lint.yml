name: ansible_lint
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - '.github/scripts/**'
      - 'tests/**/*.py'
      - 'requirements-dev.txt'
      - 'roles/**/*.yml'
      - 'roles/**/*.yaml'
      - 'workstation.yml'
      - 'workstation.yaml'
      - 'test.yml'
      - 'test.yaml'
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/scripts/**'
      - 'tests/**/*.py'
      - 'requirements-dev.txt'
      - 'roles/**/*.yml'
      - 'roles/**/*.yaml'
      - 'workstation.yml'
      - 'workstation.yaml'
      - 'test.yml'
      - 'test.yaml'
  workflow_dispatch: {}
jobs:
  ansible_lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: setup python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: install ansible-lint
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: prepare CI dependency artifact paths
        run: |
          echo "CI_ARTIFACT_ID=ansible-lint" >> "$GITHUB_ENV"
          echo "CI_ARTIFACT_DIR=${GITHUB_WORKSPACE}/ci-artifacts/ansible-lint" >> "$GITHUB_ENV"
      - name: generate resolved-version manifest and SBOM
        run: |
          python3 .github/scripts/generate_ci_dependency_artifacts.py \
            --output-dir "$CI_ARTIFACT_DIR" \
            --job-name "$CI_ARTIFACT_ID"
      - name: run lint hook unit tests
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: run ansible-lint on scoped ansible files
        run: |
          lint_targets=()
          for target in roles workstation.yml workstation.yaml test.yml test.yaml; do
            if [ -e "${target}" ]; then
              lint_targets+=("${target}")
            fi
          done

          if [ "${#lint_targets[@]}" -eq 0 ]; then
            echo "No scoped Ansible targets found to lint." >&2
            exit 1
          fi

          ansible-lint --offline "${lint_targets[@]}"
      - name: upload resolved-version manifest and SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-dependency-evidence-${{ env.CI_ARTIFACT_ID }}
          path: ${{ env.CI_ARTIFACT_DIR }}
          if-no-files-found: error
