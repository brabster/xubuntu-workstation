name: ansible_lint
on:
  push:
    paths:
      - '.github/workflows/ansible_lint.yml'
      - 'roles/**/*.yml'
      - 'roles/**/*.yaml'
      - 'workstation.yml'
      - 'test.yml'
  pull_request:
    paths:
      - '.github/workflows/ansible_lint.yml'
      - 'roles/**/*.yml'
      - 'roles/**/*.yaml'
      - 'workstation.yml'
      - 'test.yml'
  workflow_dispatch: {}
jobs:
  ansible_lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: install ansible-lint
        run: |
          python -m pip install --upgrade pip
          python -m pip install ansible-lint==26.9.0
      - name: select changed ansible files
        id: changed
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            diff_base="${{ github.event.pull_request.base.sha }}"
          else
            diff_base="${{ github.event.before }}"
          fi

          if [ -z "${diff_base}" ] || [ "${diff_base}" = "0000000000000000000000000000000000000000" ]; then
            changed_files=$(git ls-files roles workstation.yml workstation.yaml test.yml test.yaml | grep -E '^(roles/.*\.ya?ml|workstation\.ya?ml|test\.ya?ml)$' || true)
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            changed_files=$(git diff --name-only "${diff_base}...HEAD" -- roles workstation.yml workstation.yaml test.yml test.yaml | grep -E '^(roles/.*\.ya?ml|workstation\.ya?ml|test\.ya?ml)$' || true)
          else
            changed_files=$(git diff --name-only "${diff_base}..HEAD" -- roles workstation.yml workstation.yaml test.yml test.yaml | grep -E '^(roles/.*\.ya?ml|workstation\.ya?ml|test\.ya?ml)$' || true)
          fi

          changed_files=$(echo "${changed_files}" | sed '/^$/d' || true)
          echo "files<<EOF" >> "${GITHUB_OUTPUT}"
          echo "${changed_files}" >> "${GITHUB_OUTPUT}"
          echo "EOF" >> "${GITHUB_OUTPUT}"
      - name: run ansible-lint on changed ansible files
        if: steps.changed.outputs.files != ''
        run: |
          mapfile -t files <<< "${{ steps.changed.outputs.files }}"
          printf '%s\n' "${files[@]}"
          ANSIBLE_LINT_NODEPS=1 ansible-lint "${files[@]}"
