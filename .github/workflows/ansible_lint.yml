name: ansible_lint
on:
  push:
    paths:
      - 'roles/**/*.yml'
      - 'roles/**/*.yaml'
      - 'workstation.yml'
      - 'workstation.yaml'
      - 'test.yml'
      - 'test.yaml'
  pull_request:
    paths:
      - 'roles/**/*.yml'
      - 'roles/**/*.yaml'
      - 'workstation.yml'
      - 'workstation.yaml'
      - 'test.yml'
      - 'test.yaml'
  workflow_dispatch: {}
jobs:
  ansible_lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: install ansible-lint version from pre-commit config
        shell: bash
        run: |
          python -m pip install --upgrade pip
          ANSIBLE_LINT_VERSION="$(python3 - <<'PY'
          from pathlib import Path

          in_ansible_lint_block = False
          for raw_line in Path(".pre-commit-config.yaml").read_text(encoding="utf-8").splitlines():
              stripped = raw_line.strip()
              if stripped.startswith("- repo:"):
                  in_ansible_lint_block = stripped == "- repo: https://github.com/ansible/ansible-lint"
                  continue
              if in_ansible_lint_block and stripped.startswith("rev:"):
                  print(stripped.split(":", 1)[1].strip().lstrip("v"))
                  break
          else:
              raise SystemExit("Could not determine ansible-lint version from .pre-commit-config.yaml")
          PY
          )"
          python -m pip install "ansible-lint==${ANSIBLE_LINT_VERSION}"
      - name: run ansible-lint on changed ansible files
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            diff_base="${{ github.event.pull_request.base.sha }}"
          else
            diff_base="${{ github.event.before }}"
          fi

          mapfile -t changed_files < <(
            python3 scripts/changed_ansible_files.py \
              --event-name "${{ github.event_name }}" \
              --diff-base "${diff_base}"
          )

          if [ "${#changed_files[@]}" -eq 0 ]; then
            echo "No changed Ansible files to lint."
            exit 0
          fi

          printf '%s\n' "${changed_files[@]}"
          ansible-lint --offline "${changed_files[@]}"
