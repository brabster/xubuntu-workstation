name: ansible_lint
on:
  push:
    paths:
      - 'roles/**/*.yml'
      - 'roles/**/*.yaml'
      - 'workstation.yml'
      - 'test.yml'
  pull_request:
    paths:
      - 'roles/**/*.yml'
      - 'roles/**/*.yaml'
      - 'workstation.yml'
      - 'test.yml'
  workflow_dispatch: {}
jobs:
  ansible_lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: install ansible-lint
        run: |
          python -m pip install --upgrade pip
          python -m pip install ansible-lint==26.9.0
      - name: run ansible-lint on changed ansible files
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            diff_base="${{ github.event.pull_request.base.sha }}"
          else
            diff_base="${{ github.event.before }}"
          fi

          files=()
          if [ -z "${diff_base}" ] || [ "${diff_base}" = "0000000000000000000000000000000000000000" ]; then
            while IFS= read -r -d '' file; do
              files+=("${file}")
            done < <(git ls-files -z roles workstation.yml workstation.yaml test.yml test.yaml)
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            while IFS= read -r -d '' file; do
              files+=("${file}")
            done < <(git diff --name-only -z "${diff_base}...HEAD" -- roles workstation.yml workstation.yaml test.yml test.yaml)
          else
            while IFS= read -r -d '' file; do
              files+=("${file}")
            done < <(git diff --name-only -z "${diff_base}..HEAD" -- roles workstation.yml workstation.yaml test.yml test.yaml)
          fi

          changed_files=()
          for file in "${files[@]}"; do
            if [[ "${file}" =~ ^roles/.*\.ya?ml$|^workstation\.ya?ml$|^test\.ya?ml$ ]]; then
              changed_files+=("${file}")
            fi
          done

          if [ "${#changed_files[@]}" -eq 0 ]; then
            echo "No changed Ansible files to lint."
            exit 0
          fi

          printf '%s\n' "${changed_files[@]}"
          ansible-lint --offline "${changed_files[@]}"
