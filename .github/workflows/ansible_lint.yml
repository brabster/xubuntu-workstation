name: ansible_lint
on:
  push:
    paths:
      - 'roles/**/*.yml'
      - 'roles/**/*.yaml'
      - 'workstation.yml'
      - 'workstation.yaml'
      - 'test.yml'
      - 'test.yaml'
  pull_request:
    paths:
      - 'roles/**/*.yml'
      - 'roles/**/*.yaml'
      - 'workstation.yml'
      - 'workstation.yaml'
      - 'test.yml'
      - 'test.yaml'
  workflow_dispatch: {}
jobs:
  ansible_lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: install pre-commit
        run: |
          python -m pip install --upgrade pip
          python -m pip install pre-commit
      - name: run ansible-lint hook on changed ansible files
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            diff_base="${{ github.event.pull_request.base.sha }}"
          else
            diff_base="${{ github.event.before }}"
          fi

          mapfile -t changed_files < <(
            python3 scripts/changed_ansible_files.py \
              --event-name "${{ github.event_name }}" \
              --diff-base "${diff_base}"
          )

          if [ "${#changed_files[@]}" -eq 0 ]; then
            echo "No changed Ansible files to lint."
            exit 0
          fi

          printf '%s\n' "${changed_files[@]}"
          pre-commit run ansible-lint --files "${changed_files[@]}"
