---
- name: Install clamav
  ansible.builtin.package:
    name:
      - clamav
      - clamav-daemon
    state: present

- name: Configure clamav daemon
  ansible.builtin.template:
    src: clamd.conf.j2
    dest: /etc/clamav/clamd.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart clamav-daemon

- name: Ensure ClamAV log directory exists
  ansible.builtin.file:
    path: /var/log/clamav
    state: directory
    mode: '0755'

- name: Remove previous managed freshclam logging block before normalization
  ansible.builtin.blockinfile:
    path: /etc/clamav/freshclam.conf
    marker: "# {mark} ANSIBLE MANAGED FRESHCLAM LOGGING"
    state: absent
  notify: Restart clamav-freshclam

# Manage FreshClam logging explicitly so verification reads a predictable
# log location while log growth remains bounded on quiet laptops and in CI.
# Inserting the block at BOF ensures these directives win by first occurrence
# without rewriting unrelated packaged or third-party config elsewhere.
- name: Configure freshclam update logging
  ansible.builtin.blockinfile:
    path: /etc/clamav/freshclam.conf
    marker: "# {mark} ANSIBLE MANAGED FRESHCLAM LOGGING"
    append_newline: true
    insertbefore: BOF
    block: |
      UpdateLogFile {{ clamav_freshclam_log_file }}
      LogRotate yes
      LogFileMaxSize {{ clamav_freshclam_log_max_size }}
  notify: Restart clamav-freshclam

- name: Ensure FreshClam log file exists with service write access
  ansible.builtin.file:
    path: "{{ clamav_freshclam_log_file }}"
    state: touch
    owner: clamav
    group: clamav
    mode: '0644'

- name: Create a global quarantine directory
  ansible.builtin.file:
    path: "{{ clamav_quarantine_dir }}"
    state: directory
    owner: clamav
    group: clamav
    mode: '0755'

- name: Deploy ClamAV health check script
  ansible.builtin.template:
    src: clamav-verify.sh.j2
    dest: /usr/local/bin/clamav-verify.sh
    owner: root
    group: root
    mode: '0755'

- name: Verify on-access scanning is operational as part of updates
  ansible.builtin.lineinfile:
    path: '{{ update_script }}'
    line: /usr/local/bin/clamav-verify.sh {{ username }}

- name: Include CI-specific tasks
  ansible.builtin.include_tasks: ci.yml
  when: lookup('env', 'CI') == 'true'

- name: Include non-CI tasks
  ansible.builtin.include_tasks: non-ci.yml
  when: lookup('env', 'CI') != 'true'
