---
- name: Install clamav
  ansible.builtin.package:
    name:
      - clamav
      - clamav-daemon
    state: present

- name: Configure clamav daemon
  ansible.builtin.template:
    src: clamd.conf.j2
    dest: /etc/clamav/clamd.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart clamav-daemon

- name: Remove superseded managed freshclam logging block
  ansible.builtin.blockinfile:
    path: /etc/clamav/freshclam.conf
    marker: "# {mark} ANSIBLE MANAGED FRESHCLAM LOGGING"
    state: absent
  notify: Restart clamav-freshclam

- name: Normalize freshclam logging directives
  ansible.builtin.replace:
    path: /etc/clamav/freshclam.conf
    regexp: '{{ item.regexp }}'
    replace: '{{ item.line }}'
  loop:
    - regexp: '^\s*#?\s*UpdateLogFile\s+\S+\s*$'
      line: 'UpdateLogFile {{ clamav_freshclam_log_file }}'
    - regexp: '^\s*#?\s*LogRotate\s+(yes|no)\s*$'
      line: 'LogRotate yes'
    - regexp: '^\s*#?\s*LogFileMaxSize\s+\S+\s*$'
      line: 'LogFileMaxSize {{ clamav_freshclam_log_max_size }}'
  notify: Restart clamav-freshclam

- name: Ensure freshclam logging directives are present
  ansible.builtin.lineinfile:
    path: /etc/clamav/freshclam.conf
    regexp: '{{ item.regexp }}'
    line: '{{ item.line }}'
    insertafter: EOF
  loop:
    - regexp: '^UpdateLogFile {{ clamav_freshclam_log_file | regex_escape() }}$'
      line: 'UpdateLogFile {{ clamav_freshclam_log_file }}'
    - regexp: '^LogRotate yes$'
      line: 'LogRotate yes'
    - regexp: '^LogFileMaxSize {{ clamav_freshclam_log_max_size | regex_escape() }}$'
      line: 'LogFileMaxSize {{ clamav_freshclam_log_max_size }}'
  notify: Restart clamav-freshclam

- name: Create a global quarantine directory
  ansible.builtin.file:
    path: "{{ clamav_quarantine_dir }}"
    state: directory
    owner: clamav
    group: clamav
    mode: '0755'

- name: Deploy ClamAV health check script
  ansible.builtin.template:
    src: clamav-verify.sh.j2
    dest: /usr/local/bin/clamav-verify.sh
    owner: root
    group: root
    mode: '0755'

- name: Verify on-access scanning is operational as part of updates
  ansible.builtin.lineinfile:
    path: '{{ update_script }}'
    line: /usr/local/bin/clamav-verify.sh {{ username }}

- name: Include CI-specific tasks
  ansible.builtin.include_tasks: ci.yml
  when: lookup('env', 'CI') == 'true'

- name: Include non-CI tasks
  ansible.builtin.include_tasks: non-ci.yml
  when: lookup('env', 'CI') != 'true'
