---
# tasks file for chrome-browser
- name: Fetch Chrome Browser
  ansible.builtin.get_url:
    url: https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
    dest: /tmp/google-chrome.deb
    mode: '0644'

- name: Refresh apt package metadata for Chrome dependency resolution
  ansible.builtin.apt:
    update_cache: true
  when:
    - ansible_facts['distribution'] == 'Ubuntu'

- name: Pre-install ALSA library for Chrome with fallback
  when:
    - ansible_facts['distribution'] == 'Ubuntu'
  block:
    - name: Pre-install ALSA library for Chrome (libasound2t64)
      ansible.builtin.apt:
        name: libasound2t64
        state: present
  rescue:
    - name: Stop if libasound2t64 failed for reasons other than missing package
      ansible.builtin.fail:
        msg: "{{ ansible_failed_result.msg | default('libasound2t64 install failed') }}"
      when: "'Unable to locate package libasound2t64' not in (ansible_failed_result.msg | default(''))"

    - name: Pre-install ALSA library for Chrome (libasound2 fallback)
      ansible.builtin.apt:
        name: libasound2
        state: present

- name: Install Chrome
  ansible.builtin.apt:
    deb: /tmp/google-chrome.deb
