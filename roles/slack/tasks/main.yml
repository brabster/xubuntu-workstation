---
- name: Ensure APT keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Download Slack Packagecloud GPG key
  ansible.builtin.get_url:
    url: https://packagecloud.io/slacktechnologies/slack/gpgkey
    dest: /etc/apt/keyrings/slack.asc
    mode: '0644'

- name: Add Slack APT repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/slack.list
    content: |
      deb [signed-by=/etc/apt/keyrings/slack.asc] https://packagecloud.io/slacktechnologies/slack/debian jessie main
    mode: '0644'

- name: Refresh apt package metadata for Slack
  ansible.builtin.apt:
    update_cache: true

- name: Install Slack desktop package
  ansible.builtin.apt:
    name: slack-desktop
    state: present
