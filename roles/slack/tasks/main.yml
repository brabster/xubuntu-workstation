---
- name: Add Slack APT repository
  ansible.builtin.deb822_repository:
    name: slack
    architectures:
      - amd64
    components:
      - main
    install_python_debian: true
    signed_by: https://packagecloud.io/slacktechnologies/slack/gpgkey
    suites:
      - jessie
    types:
      - deb
    uris:
      - https://packagecloud.io/slacktechnologies/slack/debian/

- name: Install Slack desktop package
  ansible.builtin.apt:
    name: slack-desktop
    state: present
    update_cache: true
    cache_valid_time: 3600
