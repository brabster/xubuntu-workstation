---
- name: Check whether snap is available
  ansible.builtin.stat:
    path: /usr/bin/snap
  register: slack_snap_binary

- name: Check whether Slack snap is installed
  ansible.builtin.command:
    argv:
      - snap
      - list
      - slack
  register: slack_snap_list
  changed_when: false
  failed_when: false
  when: slack_snap_binary.stat.exists

- name: Remove Slack snap before installing Slack desktop package
  ansible.builtin.command:
    argv:
      - snap
      - remove
      - slack
  register: slack_snap_remove
  changed_when: slack_snap_remove.rc == 0
  when:
    - slack_snap_binary.stat.exists
    - slack_snap_list.rc == 0

- name: Ensure apt keyring directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Check whether Slack apt keyring already exists
  ansible.builtin.stat:
    path: /etc/apt/keyrings/slacktechnologies_slack-archive-keyring.gpg
  register: slack_apt_keyring

- name: Download Slack apt signing key
  ansible.builtin.get_url:
    url: https://packagecloud.io/slacktechnologies/slack/gpgkey
    dest: /etc/apt/keyrings/slacktechnologies_slack-archive-keyring.asc
    mode: '0644'
  register: slack_apt_signing_key

- name: Verify Slack apt signing key ID
  ansible.builtin.command:
    argv:
      - gpg
      - --show-keys
      - --with-colons
      - /etc/apt/keyrings/slacktechnologies_slack-archive-keyring.asc
  register: slack_apt_key_info
  changed_when: false
  failed_when: '"C6ABDCF64DB9A0B2" not in slack_apt_key_info.stdout'

- name: Convert Slack apt signing key to keyring format
  ansible.builtin.command:
    argv:
      - gpg
      - --dearmor
      - --yes
      - --output
      - /etc/apt/keyrings/slacktechnologies_slack-archive-keyring.gpg
      - /etc/apt/keyrings/slacktechnologies_slack-archive-keyring.asc
  changed_when: slack_apt_signing_key.changed or not slack_apt_keyring.stat.exists
  when: slack_apt_signing_key.changed or not slack_apt_keyring.stat.exists

- name: Add Slack apt repository
  ansible.builtin.deb822_repository:
    architectures:
      - amd64
    components:
      - main
    name: slack
    signed_by: /etc/apt/keyrings/slacktechnologies_slack-archive-keyring.gpg
    suites:
      - >-
        {{
          ansible_facts["distribution_release"]
          if ansible_facts["distribution_release"] in ["focal", "jammy", "noble"]
          else "noble"
        }}
    types:
      - deb
    uris:
      - https://packagecloud.io/slacktechnologies/slack/ubuntu/

- name: Install Slack desktop package
  ansible.builtin.apt:
    cache_valid_time: 3600
    name: slack-desktop
    state: present
    update_cache: true

- name: Remove Slack repository maintenance cron job
  ansible.builtin.file:
    path: /etc/cron.daily/slack
    state: absent
