---
- name: Stop and disable cups
  ansible.builtin.service:
    name: cups
    state: stopped
    enabled: false
  when: not is_gh_actions

- name: Remove legacy cups_users sudoers grant
  ansible.builtin.lineinfile:
    dest: /etc/sudoers
    state: absent
    regexp: '^%cups_users\s'
    validate: visudo -cf %s

- name: Check whether the legacy cups_users group exists
  ansible.builtin.command:
    argv:
      - getent
      - group
      - cups_users
  register: cups_legacy_group
  changed_when: false
  failed_when: false

- name: Remove the workstation user from the legacy cups_users group
  ansible.builtin.command:
    argv:
      - gpasswd
      - -d
      - '{{ username }}'
      - cups_users
  register: cups_legacy_group_removal
  changed_when: cups_legacy_group_removal.rc == 0
  when:
    - cups_legacy_group.rc == 0
    - username in cups_legacy_group.stdout.split(':')[-1].split(',')

- name: Remove the unused cups_users group
  ansible.builtin.group:
    name: cups_users
    state: absent
